name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace, plugins and SKILL.md files
        run: python3 scripts/validate_skills.py
      - name: Test dag-pr-review scheduler
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python3 -m unittest discover -s plugins/dag-pr-review/skills/dag-pr-review/tests -v
